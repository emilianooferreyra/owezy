# Calls the deployed app's reconciliation every 15 minutes: the Vercel Hobby plan only runs its own
# crons once a day. GitHub may start a scheduled run a few minutes late, which is fine for a
# safety net (the payment cards also reconcile when the owner looks at them).
#
# Setup, in the repository's Settings → Secrets and variables → Actions:
#   - variable APP_URL: the deployed origin, e.g. https://your-app.vercel.app
#   - secret CRON_SECRET: the same value as CRON_SECRET in the Vercel project
# Until APP_URL is set, the job does nothing.
name: Reconcile payments

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reconciliation endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$APP_URL/api/cron/reconcile" \
            -H "Authorization: Bearer $CRON_SECRET"
