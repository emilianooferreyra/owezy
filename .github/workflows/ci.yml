# Typechecks and tests every pull request and every push to main, so nothing merges unchecked.
# The tests need no secrets and no network: Postgres runs in memory (PGlite) and the model and
# Celo are faked.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the job only checks out code and runs local commands.
permissions:
  contents: read

# A new push to a pull request cancels its older run. On main every commit keeps its own result,
# so a broken merge can be traced to the commit that broke it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
